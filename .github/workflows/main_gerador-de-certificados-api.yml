name: Build and deploy Gerador de Certificados API

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/main_gerador-de-certificados-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: server/GeradorCertificados.slnx
  API_PROJECT: server/src/GeradorCertificados.Api/GeradorCertificados.Api.csproj
  PUBLISH_DIRECTORY: ${{ github.workspace }}/publish

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Restore dependencies
        run: dotnet restore $env:SOLUTION_PATH

      - name: Build solution
        run: dotnet build $env:SOLUTION_PATH --configuration Release --no-restore

      - name: Run tests
        run: dotnet test $env:SOLUTION_PATH --configuration Release --no-build

      - name: Publish API
        run: dotnet publish $env:API_PROJECT --configuration Release --no-build --output $env:PUBLISH_DIRECTORY

      - name: Add client to deployment package
        shell: pwsh
        run: |
          $clientPath = Join-Path $env:GITHUB_WORKSPACE 'client/dist/GeradorCertificados/browser'
          $wwwrootPath = Join-Path $env:PUBLISH_DIRECTORY 'wwwroot'

          New-Item -ItemType Directory -Path $wwwrootPath -Force | Out-Null
          Copy-Item -Path "$clientPath\*" -Destination $wwwrootPath -Recurse -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v6
        with:
          name: api
          path: ${{ env.PUBLISH_DIRECTORY }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v7
        with:
          name: api

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E013009172B43B5AE3741F69EAD8322 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3A9FFDBAF4DD4717B3933FE63C547161 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_38870140B761402EB2AD5D629D582A8B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
